name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .[dev,db,api,storage]  # extras so mypy/tests cover those layers

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Format check (ruff)
        run: ruff format --check src tests tools

      - name: Typecheck (mypy)
        run: mypy

      - name: Unit tests + coverage
        run: pytest -m "not integration and not golden" --cov --cov-report=xml

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
