version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies]
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies]
