# Local infrastructure for attrpipe (docs/07-tech-stack-infrastructure.md).
#
# Profiles:
#   core        Postgres+pgvector (fact store), RabbitMQ (queues), MinIO (raw store)
#   search      OpenSearch (BM25 lexical index)
#   monitoring  Prometheus + Grafana (docs/08-telemetry-standards.md)
#
# Usage:  python tools/dev.py up          # core + monitoring
#         docker compose --profile search up -d

name: attrpipe

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attrpipe}
      POSTGRES_USER: ${POSTGRES_USER:-attrpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attrpipe-local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-attrpipe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-attrpipe-local}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-attrpipe}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-attrpipe-local}
    ports:
      - "9000:9000"
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/raw-artifacts &&
      mc version enable local/raw-artifacts || true
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:-attrpipe}
      MINIO_PASS: ${S3_SECRET_KEY:-attrpipe-local}

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-attrpipe-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  rabbitmqdata:
  miniodata:
  osdata:
  promdata:
  grafanadata:
