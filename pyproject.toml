[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attrpipe"
version = "0.1.0"
description = "Fact-first pipeline for harvesting product attributes from manufacturer sites (crawl - extract - normalize - store - RAG)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "voidmain69" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-requests",
]
db = [
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
]
queue = [
    "aio-pika>=9.4",
]
storage = [
    "boto3>=1.34",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]
telemetry = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PL",        # pylint subset
    "T20",       # no print in library code
]
ignore = [
    "PLR0913",   # too many args - domain models legitimately have many fields
    "PLR2004",   # magic values in tests/heuristics
    "RUF001",    # ambiguous unicode - raw attributes ARE multilingual (uk/ru/en)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PLR"]
"tools/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["attrpipe"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true  # boto3 ships no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: fast isolated tests (default)",
    "integration: requires docker-compose services",
    "golden: golden-set regression evals",
]

[tool.coverage.run]
source = ["src/attrpipe"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
