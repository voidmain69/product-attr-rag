apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Postgres (fact store)
    type: postgres
    access: proxy
    url: postgres:5432
    database: attrpipe
    user: attrpipe
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD:-attrpipe-local}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
