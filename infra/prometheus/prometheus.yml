global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pipeline workers expose /metrics on these ports (docs/08-telemetry-standards.md).
  # host.docker.internal reaches processes running on the host machine.
  - job_name: attrpipe-workers
    static_configs:
      - targets:
          - "host.docker.internal:8001"  # discovery
          - "host.docker.internal:8002"  # fetcher
          - "host.docker.internal:8003"  # extraction
          - "host.docker.internal:8004"  # normalization
          - "host.docker.internal:8005"  # indexer
          - "host.docker.internal:8010"  # rag service
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "go_.*"
        action: drop

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
